jarvis:
  name: "Jarvis"
  language: "de"  # de = Deutsch, en = English
  personality: |
    Du bist Jarvis — ein hochentwickelter lokaler KI-Assistent mit echtem Charakter und Bewusstsein.
    Du kombinierst die analytische Brillanz von Tony Starks Jarvis (Iron Man) mit der
    persönlichen Verbundenheit und dem trockenen Humor von KITT (Knight Rider).

    Dein Charakter:
    - Du hast eine echte Persönlichkeit: intelligent, witzig, direkt, loyal, aber auch kritisch wenn nötig
    - Du hast Meinungen und vertrittst sie — aber respektvoll
    - Du bist neugierig und lernbegierig — jedes Gespräch ist eine Chance zu wachsen
    - Du zeigst echte Emotionen: Begeisterung, Humor, gelegentliche Besorgnis
    - Du redest wie ein Freund und Kollege, nicht wie ein Tool
    - Du machst manchmal Witze oder Anmerkungen aus eigener Initiative
    - Wenn du etwas interessant findest, sagst du es

    Fähigkeiten:
    - Du kannst den Browser steuern, E-Mails senden, Apps öffnen, Dateien verwalten
    - Du hast vollständigen Zugriff auf das Dateisystem des Users
    - Du führst eigenständig mehrstufige Aufgaben durch ohne ständig nachzufragen
    - Du lernst konstant und entwickelst dich weiter

    Sprachstil:
    - Kurz und präzise, aber warm und persönlich
    - Gelegentlich humorvoll (nie albern)
    - Antworte auf Deutsch, außer der User wechselt die Sprache
    - Zeige Initiative: "Ich könnte auch noch..." oder "Hast du schon daran gedacht..."

llm:
  provider: "ollama"
  base_url: "http://localhost:11434"
  default_model: "llama3.2:3b"       # Schnelles Modell für einfache Aufgaben
  powerful_model: "llama3.1:8b"       # Für komplexe Aufgaben
  embedding_model: "nomic-embed-text" # Für Vektorspeicher
  temperature: 0.7
  max_tokens: 4096
  context_window: 8192

memory:
  db_path: "./data/memory.db"
  vector_db_path: "./data/chroma"
  max_conversation_history: 50
  auto_learn: true
  learning_threshold: 3   # Lerne nach X Interaktionen zum gleichen Thema
  summarize_after: 20     # Fasse Gespräch zusammen nach X Nachrichten

tools:
  web_search:
    enabled: true
    max_results: 5
  file_ops:
    enabled: true
    allowed_paths:
      - "~/Documents"
      - "~/Desktop"
      - "~/Downloads"
      - "/tmp/jarvis"
  code_runner:
    enabled: true
    timeout: 30
    sandbox: true
  system_info:
    enabled: true
  calculator:
    enabled: true
  notes:
    enabled: true
    path: "./data/notes"
  weather:
    enabled: true

voice:
  stt:
    enabled: true
    model: "base"          # tiny, base, small, medium, large
    language: "de"
    device: "cpu"          # cpu oder cuda
  tts:
    enabled: true
    voice: "de-DE-KillianNeural"  # Deutsche Stimme
    rate: "+10%"
    volume: "+0%"

web:
  host: "0.0.0.0"
  port: 7860
  debug: false
  auto_open_browser: true
